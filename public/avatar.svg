<!-- webOS avatar — an emoji on a soft gradient. Change the emoji in the <text> element (or replace this file). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9d6ff" />
      <stop offset="1" stop-color="#7f8cff" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)" />
  <rect width="256" height="256" fill="url(#sheen)" />
  <text x="128" y="134" text-anchor="middle" dominant-baseline="central" font-size="132" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🚀</text>
</svg>
